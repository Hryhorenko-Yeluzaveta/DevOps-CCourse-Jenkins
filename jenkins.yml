jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy: 
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false


credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "gitgub-app-repo"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
              description: "Доступ до приватного репозиторію з застосунком"
